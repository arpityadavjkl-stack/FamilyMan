name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Add build-only Firebase placeholder
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"familyman-build-placeholder","storage_bucket":"familyman-build-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:com.familyguard","android_client_info":{"package_name":"com.familyguard"}},"api_key":[{"current_key":"dummy-api-key"}],"services":{}}],"configuration_version":"1"}
          JSON
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: familyman-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
